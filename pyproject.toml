[project]
name = "codeblitz-microservice"
version = "0.1.0"
description = "Coding Question Variant Generator Microservice for CodeBlitz 1v1 Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    
    # Database
    "supabase>=2.10.0",
    
    # HTTP Client (for PISTON API, LLM calls)
    "httpx>=0.27.0",
    
    # LLM SDKs
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    
    # Validation & Settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    
    # Environment
    "python-dotenv>=1.0.0",
    
    # Retry logic
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
